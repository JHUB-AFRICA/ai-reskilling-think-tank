name: ai-reskilling-platform

# The default service is the complete platform: React SPA, FastAPI, NLP and
# AI analysis in one image and one browser origin. Streamlit is available as
# an optional operations/research interface using that same image.
services:
  app:
    image: ${GHCR_IMAGE:-ghcr.io/jhub-africa/ai-reskilling-think-tank:main}
    build:
      context: .
      dockerfile: Dockerfile.unified
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      DISABLE_LOCAL_PREVIEW: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
    volumes:
      - lrs_data:/app/data/processed
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  streamlit:
    image: ${GHCR_IMAGE:-ghcr.io/jhub-africa/ai-reskilling-think-tank:main}
    profiles: ["streamlit"]
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      RESKILLING_API_URL: http://app:8000
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    working_dir: /app
    ports:
      - "8501:8501"
    restart: unless-stopped

volumes:
  lrs_data:
