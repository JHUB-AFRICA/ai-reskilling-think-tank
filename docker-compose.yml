# ============================================================
# Docker Compose — AI Reskilling Think Tank Platform
# ============================================================
# Uses the single unified image that contains both the React
# frontend (served as static files) and the FastAPI backend.
#
# Quick start:
#   cp .env.example .env          # fill in real secrets
#   docker compose up
#
# Rebuild after source changes:
#   docker compose up --build
#
# Stop:
#   docker compose down
#
# Pull the pre-built image from GHCR (no build needed):
#   docker compose pull && docker compose up
# ============================================================

name: ai-reskilling-platform

services:
  app:
    # ── Image ────────────────────────────────────────────────
    # Set GHCR_IMAGE in your .env to use the pre-built registry
    # image, e.g.:
    #   GHCR_IMAGE=ghcr.io/JHUB-AFRICA/ai-reskilling-think-tank:latest
    #
    # If GHCR_IMAGE is not set, compose falls back to building
    # locally from Dockerfile.unified.
    image: ${GHCR_IMAGE:-reskilling-platform-unified:local}
    build:
      context: .
      dockerfile: Dockerfile.unified
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}

    container_name: reskilling_app
    restart: unless-stopped

    ports:
      # Host port 8000 → container port 8000 (Uvicorn)
      # Change the left side (e.g. "80:8000") to expose on port 80
      - "8000:8000"

    env_file:
      - ./reskilling-platform/.env

    environment:
      # Allow the browser to reach the API from these origins.
      # When running the unified image, both frontend & API share
      # the same origin so CORS is effectively a no-op, but keep
      # this for dev-server access.
      - CORS_ORIGINS=http://localhost:8000,http://localhost:3000,http://localhost:5173

    volumes:
      # Persist xAPI LRS / processed data across container restarts
      - lrs_data:/app/data/processed

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

    networks:
      - reskilling_net

# ── Named Volumes ─────────────────────────────────────────────
volumes:
  lrs_data:
    name: reskilling_lrs_data

# ── Networks ──────────────────────────────────────────────────
networks:
  reskilling_net:
    name: reskilling_network
    driver: bridge
