[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reskilling-platform"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "spacy>=3.7",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pyjwt>=2.9",
    "google-genai>=0.3",
    "streamlit>=1.35",
]

[project.optional-dependencies]
# Streamlit web UI (legacy — not used by the Docker/FastAPI server)
ui = []
dev = ["pytest", "ruff", "ipykernel", "httpx2"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["reskilling", "app_api"]

[tool.setuptools.package-dir]
reskilling = "src/reskilling"
app_api = "app_api"
