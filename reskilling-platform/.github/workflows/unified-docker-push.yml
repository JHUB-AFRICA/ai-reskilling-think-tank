name: Build and Push Unified Docker Image

on:
  workflow_dispatch:  # Allow manual trigger
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'app_api/**'
      - 'reskilling/**'
      - 'pyproject.toml'

jobs:
  build-and-push-unified:
    name: Build & Push Unified Image (Frontend + Backend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout backend (reskilling-platform)
        uses: actions/checkout@v4
        with:
          path: reskilling-platform

      - name: Checkout frontend (CareerDev)
        uses: actions/checkout@v4
        with:
          repository: Brian-code-lab/CareerDev
          path: CareerDev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write Dockerfile.unified
        run: |
          cat > Dockerfile.unified << 'EOF'
          # Stage 1: Build the React frontend
          FROM node:20-alpine AS frontend-builder
          WORKDIR /app
          COPY CareerDev/package.json CareerDev/package-lock.json ./
          RUN npm install --prefer-offline --no-audit --no-fund
          COPY CareerDev/ .
          ARG VITE_SUPABASE_URL
          ARG VITE_SUPABASE_ANON_KEY
          ENV VITE_SUPABASE_URL=$VITE_SUPABASE_URL
          ENV VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY
          ENV VITE_API_URL=""
          RUN npm run build

          # Stage 2: Build the FastAPI backend + serve frontend
          FROM python:3.11-slim
          WORKDIR /app
          RUN apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev && rm -rf /var/lib/apt/lists/*
          RUN pip install --upgrade pip
          COPY reskilling-platform/pyproject.toml .
          RUN pip install --retries 5 --timeout 60 \
              "fastapi>=0.111" "uvicorn[standard]>=0.30" "spacy>=3.7" \
              "pandas>=2.2" "scikit-learn>=1.4" "python-dotenv>=1.0" \
              "requests>=2.31" "sqlalchemy>=2.0" "psycopg2-binary>=2.9" \
              "pyjwt>=2.9" "google-genai>=0.3"
          RUN python -m spacy download en_core_web_md
          COPY reskilling-platform/ .
          RUN pip install --no-deps -e .
          COPY --from=frontend-builder /app/dist ./static
          RUN useradd --create-home --shell /bin/bash appuser && chown -R appuser:appuser /app
          USER appuser
          EXPOSE 8000
          HEALTHCHECK --interval=30s --timeout=10s --start-period=120s --retries=3 \
              CMD python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
          CMD ["uvicorn", "app_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
          EOF

      - name: Build and push unified image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.unified
          push: true
          tags: |
            ghcr.io/brian-code-lab/reskilling-platform-full:latest
            ghcr.io/brian-code-lab/reskilling-platform-full:${{ github.sha }}
          build-args: |
            VITE_SUPABASE_URL=https://placeholder.supabase.co
            VITE_SUPABASE_ANON_KEY=placeholder-key
          cache-from: type=gha
          cache-to: type=gha,mode=max
