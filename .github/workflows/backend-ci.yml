name: Backend CI

on:
  push:
    branches: ["**"]
    paths:
      - "reskilling-platform/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "reskilling-platform/**"

defaults:
  run:
    working-directory: reskilling-platform

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: reskilling-platform/pyproject.toml

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check src/ app_api/ tests/

      - name: Run ruff formatter check
        run: ruff format --check src/ app_api/ tests/

  test:
    name: Tests (pytest — 90 tests)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: reskilling-platform/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Download spaCy model
        run: python -m spacy download en_core_web_md

      - name: Run tests
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml
        env:
          # Tests use mocked dependencies — no real credentials needed
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_JWT_SECRET: test-jwt-secret-32-chars-minimum-x
          DATABASE_URL: sqlite:///./test.db
          GEMINI_API_KEY: test-gemini-key

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: reskilling-platform/test-results.xml
          retention-days: 30
